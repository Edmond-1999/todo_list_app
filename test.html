<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Task Checklist</title>
    <style>
        /* Optional basic styling for readability */
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 8px;
        }
        /* Optional: Strike through text when checked */
        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>

    <h2>Task Checklist</h2>
    <ul>
        <li>
            <input type="checkbox" id="task1" name="task1">
            <label for="task1">Review project proposal</label>
        </li>
        <li>
            <input type="checkbox" id="task2" name="task2">
            <label for="task2">Send follow-up emails</label>
        </li>
        <li>
            <input type="checkbox" id="task3" name="task3" checked>
            <label for="task3">Update documentation</label>
        </li>
    </ul>

</body>
</html>

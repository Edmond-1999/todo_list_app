<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id = "wrapper">
        <header>
            <div id = "page-banner">
                <h1>To-Do App</h1>
                <p>Tasks</p>
                <form id = "find-task">
                    <input type="text" placeholder="Find Task......">
                </form>
            </div>
        </header>

        <div id = "task-list">
            <h3>Task List</h3>
            
            <ul>
                <li>
                    <input type="checkbox" id="task" name="task1">
                    <label for="task1">Dance</label>
                    <span class="delete">delete</span>
                </li>
            </ul>

        </div>
        <form id="add-task">
            <input type="text" placeholder="Add Task.....">
            <button>Add</button>
        </form>


    </div>
</body>
<script src="script.js"></script>
</html>
